name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME || 'root' }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          script_stop: true
          script: |
            echo "============================================="
            echo " Starting Heer Ranjha Automated Deployment "
            echo "============================================="

            DEPLOY_DIR="${{ secrets.HOSTINGER_APP_DIR || '/var/www/heer-ranjha' }}"
            
            # Ensure target directory exists
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "Target directory $DEPLOY_DIR does not have git initialized. Please clone repository first."
              exit 1
            fi

            cd "$DEPLOY_DIR"

            echo "[1/5] Pulling latest code from GitHub main branch..."
            git reset --hard HEAD
            git pull origin main

            echo "[2/5] Installing dependencies..."
            npm install --production=false

            echo "[3/5] Syncing database schema with Prisma..."
            if [ -f "prisma/schema.prisma" ]; then
              npx prisma generate
              npx prisma db push --accept-data-loss || true
            fi

            echo "[4/5] Building Next.js production bundle..."
            npm run build

            echo "[5/5] Reloading PM2 process..."
            if pm2 describe heer-ranjha > /dev/null 2>&1; then
              pm2 reload heer-ranjha --update-env
            else
              pm2 start ecosystem.config.js
            fi
            pm2 save

            echo "============================================="
            echo " Heer Ranjha Deployment Successfully Completed! "
            echo "============================================="
